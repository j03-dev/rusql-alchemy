[workspace.package]
version = "0.6.2"
edition = "2024"
authors = ["FITAHIANA Nomeniavo Joe <24nomeniavo@gmail.com>"]
keywords = ["orm", "rust", "django-orm", "lib"]
license = "Apache-2.0"
readme = "README.md"
description = "Rust Alchemy is Django ORM like lib for Rust"
documentation = "https://docs.rs/rusql-alchemy/latest/rusql_alchemy/"
homepage = "https://github.com/j03-dev/rusql-alchemy"
repository = "https://github.com/j03-dev/rusql-alchemy"

[workspace]
resolver = "2"
members = [
  "rusql-alchemy",
  "rusql-alchemy-derive",
  "rusql-alchemy-migration",
  "tests",
]


[workspace.dependencies]
# Core utilities & async
async-trait = "0.1.92"
thiserror = "2"

# Serialization
serde = "1.0"
serde_json = "1.0"

# Database
sqlx = "0.9.0"
libsql = "0.10.0"
sqlparser = "0.64.0"

chrono = "0.4.42"
sha2 = "0.11.1"
inventory = "0.3"

# macro
proc-macro2 = "1"
quote = "1.0.42"
syn = "=2.0"      # do not upgrade yet
deluxe = "0.5"

[workspace.dependencies.rusql-alchemy]
version = "0.6.2"
path = "rusql-alchemy"
default-features = false

[workspace.dependencies.rusql-alchemy-derive]
version = "0.6.2"
path = "rusql-alchemy-derive"
